name: Validate Site

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Install ghactl
        uses: action-stars/ghactl-action@ee93644a33e63f19d4af8cee920710fdff236af8 # v0.1.0
        with:
          token: ${{ github.token }}
          version: latest

      - name: Install tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ghactl tool install --owner rvben --repo rumdl --version latest
          ghactl tool install --owner mikefarah --repo yq --version latest

      - name: Lint
        run: rumdl check --output-format github .

      - name: Get Hugo version
        id: hugo_version
        run: echo "version=$(yq --unwrapScalar '.module.hugoVersion.max // "latest"' ./hugo.yaml)" >> "${GITHUB_OUTPUT}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ steps.hugo_version.outputs.version }}
          extended: true

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --environment production \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
